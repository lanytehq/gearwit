# yamllint disable rule:document-start
# yamllint disable rule:truthy
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GONEAT_VERSION: v0.6.0

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.4
      options: --user 1001
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure goneat pin
        run: |
          set -euo pipefail
          actual="$(goneat --version 2>&1 | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          if [ "v${actual#v}" != "$GONEAT_VERSION" ]; then
            mkdir -p "$HOME/.local/bin"
            sfetch --repo fulmenhq/goneat --tag "$GONEAT_VERSION" \
              --dest-dir "$HOME/.local/bin" --require-minisign
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          make goneat-version

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: make check
