# yamllint disable rule:document-start
# yamllint disable rule:truthy
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GONEAT_VERSION: v0.6.0

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.4
      options: --user 1001
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned tools
        run: |
          set -euo pipefail
          bun_version="$(tr -d ' \n\r' < .bun-version)"
          mkdir -p "$HOME/.local/bin"
          sfetch --repo fulmenhq/goneat --tag "$GONEAT_VERSION" \
            --dest-dir "$HOME/.local/bin" --require-minisign
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          npm install --global --prefix "$HOME/.local" \
            --allow-scripts=bun "bun@$bun_version"
          test "$(bun --version)" = "$bun_version"
          make goneat-version

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: make gate
