# yamllint disable rule:document-start
# yamllint disable rule:truthy
# yamllint disable rule:line-length
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GONEAT_VERSION: v0.6.0

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.4
      options: --user 1001
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: ${{ github.workspace }}/../_cargo
      TMPDIR: ${{ github.workspace }}/../_tmp
      RUSTUP_HOME: ${{ github.workspace }}/../_rustup
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare tool directories
        run: mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$TMPDIR" "$HOME/.local/bin"

      - name: Install pinned tools
        run: |
          set -euo pipefail
          bun_version="$(tr -d ' \n\r' < .bun-version)"
          sfetch --repo fulmenhq/goneat --tag "$GONEAT_VERSION" \
            --dest-dir "$HOME/.local/bin" --require-minisign
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          npm install --global --prefix "$HOME/.local" \
            --allow-scripts=bun "bun@$bun_version"
          test "$(bun --version)" = "$bun_version"
          make goneat-version

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: make gate

  platform-smoke-hosted:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: smoke (linux-amd64)
            build: true
          - os: macos-14
            target: aarch64-apple-darwin
            name: smoke (macos-arm64)
            build: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: contract (windows-amd64; unix host pending)
            build: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Test workspace
        if: matrix.build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo test --workspace --all-targets --locked

      - name: Lint workspace
        if: matrix.build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Validate workspace contract
        if: ${{ !matrix.build }}
        run: cargo metadata --locked --format-version 1 --filter-platform ${{ matrix.target }}

      - name: Check formatting
        if: ${{ !matrix.build }}
        run: cargo fmt --all -- --check

  platform-smoke-arm64:
    name: ${{ matrix.name }}
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest-arm64-s
            target: aarch64-unknown-linux-gnu
            name: smoke (linux-arm64)
            build: true
          - os: windows-latest-arm64-s
            target: aarch64-pc-windows-msvc
            name: contract (windows-arm64; unix host pending)
            build: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Test workspace
        if: matrix.build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo test --workspace --all-targets --locked

      - name: Lint workspace
        if: matrix.build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Validate workspace contract
        if: ${{ !matrix.build }}
        run: cargo metadata --locked --format-version 1 --filter-platform ${{ matrix.target }}

      - name: Check formatting
        if: ${{ !matrix.build }}
        run: cargo fmt --all -- --check
