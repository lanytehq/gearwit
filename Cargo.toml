[workspace]
resolver = "3"
members = [
    "crates/gearwit-domain",
    "crates/gearwit-protocol",
    "crates/gearwit-host",
    "crates/gearwit-cli",
]
exclude = ["apps/console/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
repository = "https://github.com/lanytehq/gearwit"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gearwit-domain = { path = "crates/gearwit-domain" }
gearwit-protocol = { path = "crates/gearwit-protocol" }
gearwit-host = { path = "crates/gearwit-host" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
