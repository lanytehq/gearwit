[workspace]
resolver = "3"
members = ["crates/gearwit-domain"]
exclude = ["apps/console/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
repository = "https://github.com/lanytehq/gearwit"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gearwit-domain = { path = "crates/gearwit-domain" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
