[package]
name = "gearwit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Thin Gearwit command surface for the calling seat"

[lints]
workspace = true

[[bin]]
name = "gearwit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.45", features = ["derive"] }
gearwit-domain.workspace = true
gearwit-host.workspace = true
gearwit-protocol.workspace = true
ipcprims = { git = "https://github.com/3leaps/ipcprims", tag = "v0.2.4", default-features = false }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["formatting"] }
ulid = "1"
