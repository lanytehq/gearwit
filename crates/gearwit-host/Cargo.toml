[package]
name = "gearwit-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Local gearwitd link admission and private ipcprims socket"

[lints]
workspace = true

[dependencies]
blake3 = "1"
gearwit-protocol.workspace = true
getrandom = "0.3"
ipcprims = { git = "https://github.com/3leaps/ipcprims", tag = "v0.2.4", default-features = false }
nix = { version = "0.31", default-features = false, features = ["fs", "user"] }
# Keep rsfulmen pinned while sysprims shares the same logging ABI.
rsfulmen = { version = "=0.1.5", default-features = false, features = ["logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
subtle = "2"
sysprims-proc = { git = "https://github.com/3leaps/sysprims", tag = "v0.2.3" }
sysprims-session = { git = "https://github.com/3leaps/sysprims", tag = "v0.2.3" }
sysprims-signal = { git = "https://github.com/3leaps/sysprims", tag = "v0.2.3" }
time = { version = "0.3", default-features = false, features = ["parsing", "formatting", "macros"] }
ulid = "1"
zeroize = "1"
